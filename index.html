<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="ELO: prova de conceito de acompanhamento medicamentoso acessível. Dados fictícios, sem uso clínico.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ELO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Protótipo ELO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela — faixa de aviso, barra superior, área rolável e abas inferiores; em telas largas o app fica numa coluna de 440px. Tema claro por padrão, escuro como opção do app. */
:root{
  --backdrop:#D9DFE8; --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E7EBF2; --ink:#131A25; --muted:#545F72; --line:#D2D9E3;
  --accent:#3337A6; --accent-ink:#FFFFFF; --accent-soft:#E3E4F8;
  --ok:#14663F; --ok-soft:#DCEFE4; --warn:#7F4C00; --warn-soft:#FBEBD1; --crit:#A3221A; --crit-soft:#F8DEDA;
  --scrim:rgb(15 20 30 / .45); --shadow:0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .07);
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bw:1px; --escala:1; --tabh:72px;
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --backdrop:#05070A; --bg:#0E1218; --surface:#161C25; --sunk:#1F2732; --ink:#E7ECF3; --muted:#9DA9BA; --line:#2B3542;
  --accent:#A3A6FF; --accent-ink:#0E1218; --accent-soft:#282C57;
  --ok:#63D49D; --ok-soft:#15301F; --warn:#F2B55C; --warn-soft:#382811; --crit:#FF8D83; --crit-soft:#3B1A18;
  --scrim:rgb(0 0 0 / .62); --shadow:none;
  color-scheme:dark;
}
html:root.hc{--line:var(--ink); --muted:var(--ink); --sunk:var(--surface); --bg:var(--surface); --bw:2px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
p{margin:0}
h1,h2,h3{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}

.app{position:relative;height:100%;max-width:440px;margin-inline:auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  body{background:var(--backdrop)}
  .app{height:calc(100% - 40px);margin-block:20px;border-radius:28px;border:var(--bw) solid var(--line);box-shadow:0 24px 64px rgb(0 0 0 / .2)}
}
.poc{flex:none;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.03em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px))}
.appbar{flex:none;display:flex;align-items:center;gap:4px;min-height:62px;padding:8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));background:var(--surface);border-bottom:var(--bw) solid var(--line)}
.appbar .tt{flex:1;min-width:0}
.appbar h1{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:hover{background:var(--sunk)}
.iconbtn.fill{background:var(--accent);color:var(--accent-ink)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}

.screen{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
.screen > *{flex-shrink:0}
.screen.chat > .chatlog{flex:1 1 auto}
.screen.pac{font-size:calc(16px * var(--escala));line-height:1.5}
.screen.chat{overflow:hidden;padding-bottom:0;gap:0}
.screen.onb{gap:16px}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--surface);border-top:var(--bw) solid var(--line);padding:6px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));min-height:var(--tabh)}
.tab{font:inherit;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:2px;cursor:pointer;font-size:11.5px;font-weight:700;border-radius:14px;position:relative}
.tab .pill{width:58px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
html.hc .tab[aria-current="page"] .pill{outline:var(--bw) solid var(--ink)}
.badge{position:absolute;top:-3px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:var(--surface);font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}

.btn{font:inherit;font-weight:700;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:.55em 1em;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;text-align:center;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:38px;padding:.3em .85em;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.pac .btn{min-height:3em;border-radius:.75em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.row .grow{flex:1 1 auto}
.stackb{display:grid;gap:8px}
.chip{display:inline-flex;align-items:center;gap:.35em;font-size:.78em;font-weight:700;padding:.18em .7em;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
html.hc .chip{border:var(--bw) solid currentColor}

.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--bg)}
.card.ok{border-color:var(--ok);background:var(--ok-soft)}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.card.acc{border-color:var(--accent);background:var(--accent-soft)}
.card h3{font-family:var(--f-display);font-weight:600;font-size:1.05em;line-height:1.25}
.sec{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 4px -2px}
.pac .sec{font-size:.72em}
.sub{color:var(--muted);font-size:.92em}
.nota{color:var(--muted);font-size:.85em}
.hora{font-family:var(--f-mono);font-size:1.1em;font-weight:600}
.rx{display:flex;align-items:baseline;gap:.5em;min-width:0}
.rx .nm{font-weight:700;font-size:1.08em;min-width:0;overflow-wrap:anywhere}
.rx .lead{flex:1;min-width:.8em;border-bottom:2px dotted var(--line);transform:translateY(-.3em)}
.rx .cc{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.big{font-family:var(--f-display);font-weight:600;font-size:1.9em;line-height:1.1}
.segbar{display:flex;gap:4px}
.segbar i{flex:1;height:10px;border-radius:5px;background:var(--sunk)}
html.hc .segbar i{border:var(--bw) solid var(--ink)}
.segbar i.ok{background:var(--ok)}
.segbar i.warn{background:var(--warn)}
.acts{display:flex;gap:.5em;flex-wrap:wrap;align-items:center}
.acts .btn{flex:1 1 7.5em}

/* Lista de ajustes */
.list{background:var(--surface);border:var(--bw) solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:3.5em;border-bottom:var(--bw) solid var(--line)}
.li:last-child{border-bottom:0}
.li.col{flex-direction:column;align-items:stretch;gap:10px}
.li .lbl{font-weight:700}
.li .hint{display:block;font-weight:400;font-size:.85em;color:var(--muted)}
button.li{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:var(--bw) solid var(--line);text-align:left;cursor:pointer}
button.li:last-child{border-bottom:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.92em;min-height:2.7em;border-radius:9px;color:var(--muted);cursor:pointer;padding:.2em .4em}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
html.hc .seg button[aria-pressed="true"]{outline:var(--bw) solid var(--ink)}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:var(--bw) solid var(--line);background:var(--sunk);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .btn{min-width:3.2em;min-height:2.8em;padding:0}
.stepper .val{flex:1;text-align:center;font-family:var(--f-mono);font-weight:600}
.preview{border:var(--bw) dashed var(--line);border-radius:12px;padding:.75em .9em;display:grid;gap:.2em}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:2.6em}
.campo{display:grid;gap:.3em;font-weight:700;font-size:.92em}
.campo input,.campo select,.campo textarea{font:inherit;font-weight:400;font-size:1rem;border:var(--bw) solid var(--line);border-radius:12px;padding:.6em .75em;background:var(--surface);color:var(--ink);min-height:3em;width:100%}
.pac .campo input,.pac .campo textarea{font-size:1em}

/* Boas-vindas */
.onb-top{display:grid;gap:12px;padding-top:8px}
.onb-top h2{font-family:var(--f-display);font-weight:600;font-size:1.5em;line-height:1.25;text-wrap:balance}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--sunk)}
.dots i.on{background:var(--accent)}
.onb-foot{margin-top:auto;display:grid;gap:8px;padding-top:12px}
.opcao{font:inherit;text-align:left;display:flex;gap:12px;align-items:center;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:3.6em;width:100%}
.opcao[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opcao strong{display:block}
.opcao span{color:var(--muted);font-size:.88em}

/* Conferir */
.hero{font:inherit;text-align:left;display:flex;gap:14px;align-items:center;width:100%;border:0;border-radius:18px;padding:18px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.hero strong{display:block;font-family:var(--f-display);font-weight:600;font-size:1.12em}
.hero span{font-size:.88em;opacity:.9}
.hero .ico{width:52px;height:52px;border-radius:14px;background:rgb(255 255 255 / .16);display:grid;place-items:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;display:grid;gap:8px;cursor:pointer;align-content:start;font-weight:700;min-height:6em}
.tile .ic{color:var(--accent)}
.galeria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.galeria button{font:inherit;text-align:left;border:var(--bw) solid var(--line);background:var(--surface);border-radius:14px;padding:8px;cursor:pointer;display:grid;gap:6px;color:var(--ink);align-content:start}
.galeria small{font-size:.76em;color:var(--muted);line-height:1.3;font-weight:700}
.upload-thumb{max-width:140px;border-radius:12px;border:var(--bw) solid var(--line)}

/* Embalagens simuladas: objetos físicos com cores próprias em qualquer tema */
.pkgbox{position:relative;width:100%;aspect-ratio:1.55;max-width:100%}
.pkg{position:absolute;inset:0;border-radius:6px;padding:7px 9px 20px;overflow:hidden;color:#FFFFFF;background:var(--pk,#4E5560);display:flex;flex-direction:column;gap:1px;font-family:var(--f-display);line-height:1.15;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.pkg-lab{font-size:7.5px;opacity:.85;font-family:var(--f-mono);letter-spacing:.04em}
.pkg-nome{font-weight:700;font-size:11.5px;margin-top:3px}
.pkg-conc{font-size:14px;font-weight:600}
.pkg-forma{font-size:9px;opacity:.92}
.tarja{position:absolute;left:0;right:0;bottom:0;background:#C8102E;color:#FFFFFF;font-family:var(--f-mono);font-size:7px;letter-spacing:.05em;text-align:center;padding:3px 2px}
.baixa{filter:blur(2.4px)}
.pkg.desfoque > *{filter:blur(2.1px)}
.pkg.reflexo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 58% 42%, rgb(255 255 255 / .95), rgb(255 255 255 / .6) 34%, transparent 66%)}
.pkg.inclinada{transform:rotate(-7deg) scale(.88)}
.pkg.cortada{clip-path:inset(0 34% 0 0)}
.pkg.blister{background:#C7CCD4;color:#1A212C;box-shadow:inset 0 0 0 2px #AEB5BF}
.pkg.verso{background:#C7CCD4;color:#1A212C;justify-content:center;gap:4px;font-family:var(--f-mono);font-size:9.5px;padding:10px}
.pkg.duo1{inset:0 22% 18% 0}
.pkg.duo2{inset:20% 0 0 24%;transform:rotate(5deg)}

/* Conversa */
.chatlog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 0 12px;overscroll-behavior:contain}
.msg{max-width:88%;padding:.6em .85em;border-radius:1.1em;line-height:1.45;overflow-wrap:anywhere}
.msg.elo{background:var(--surface);border:var(--bw) solid var(--line);align-self:flex-start;border-bottom-left-radius:.3em}
.msg.voce{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:.3em}
.msg .acoes{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.6em}
.msg .acoes .btn{min-height:2.6em;font-size:.9em;flex:1 1 auto}
.msg .orig{display:block;font-size:.72em;opacity:.85;margin-top:.2em}
.chipsrow{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.chipsrow .btn{white-space:nowrap;flex:none;min-height:2.5em;font-size:.85em;font-weight:400;border-radius:999px;padding:.3em .9em}
.composer{flex:none;display:flex;gap:6px;align-items:center;padding:8px 0 12px;border-top:var(--bw) solid var(--line)}
.composer input{flex:1;min-width:0;font:inherit;font-size:1em;border:var(--bw) solid var(--line);border-radius:999px;padding:.6em 1em;background:var(--surface);color:var(--ink);min-height:2.9em}
.composer .iconbtn{width:2.9em;height:2.9em;border-radius:50%;border:var(--bw) solid var(--line);background:var(--surface)}
.composer .iconbtn.fill{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* Sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;overscroll-behavior:contain;padding:6px max(16px, env(safe-area-inset-right, 0px)) 22px max(16px, env(safe-area-inset-left, 0px));box-shadow:0 -10px 40px rgb(0 0 0 / .22);display:grid;gap:14px;animation:sobe .22s ease-out}
.sheet.pac{font-size:calc(16px * var(--escala))}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 0}
.sh{display:flex;align-items:center;gap:8px}
.sh h2{flex:1;font-family:var(--f-display);font-weight:600;font-size:1.25em;line-height:1.25}
.status-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.status-ic.ok{background:var(--ok-soft);color:var(--ok)}
.status-ic.warn{background:var(--warn-soft);color:var(--warn)}
.status-ic.crit{background:var(--crit-soft);color:var(--crit)}
.perfil-op{font:inherit;text-align:left;display:flex;gap:12px;align-items:center;width:100%;border:var(--bw) solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;cursor:pointer}
.perfil-op[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.perfil-op strong{display:block}
.perfil-op span{font-size:13px;color:var(--muted)}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* Farmacêutico e pesquisa */
.meta{font-size:12.5px;color:var(--muted)}
.rxlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rxlist li{display:grid;gap:3px;padding-bottom:12px;border-bottom:var(--bw) dashed var(--line)}
.rxlist li:last-child{border-bottom:0;padding-bottom:0}
.vazio{color:var(--muted);font-size:14px;text-align:center;padding:28px 8px}
.draft{display:grid;gap:12px}
.dfs{border:var(--bw) solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0;background:var(--surface)}
.dfs legend{font-weight:700;font-size:13px;padding:0 4px}
.draft label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.draft input,.draft select,.draft textarea,.sheet textarea{font:inherit;font-weight:400;font-size:16px;color:var(--ink);background:var(--surface);border:var(--bw) solid var(--line);border-radius:10px;padding:9px 11px;min-height:44px;width:100%}
.dconc{display:flex;gap:6px}
.dconc input{flex:1;min-width:0}
.dconc select{width:auto}
.erros{color:var(--crit);font-size:13px;font-weight:700}
.erros:empty{display:none}
.aviso{border:var(--bw) solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;font-size:13.5px;display:grid;gap:4px}
.mrow{display:grid;grid-template-columns:22px minmax(0,1fr) 52px;align-items:center;gap:8px;font-size:13px}
.mk{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.track{display:block;height:8px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.track b{position:absolute;inset:0 auto 0 0;background:var(--muted);border-radius:4px}
.mrow.c .track b{background:var(--accent)}
.mrow.c .mk{color:var(--accent)}
.mrow .num{text-align:right}
.sense{display:block;font-size:12px;color:var(--muted)}

<body>
<div class="app" id="app">
  <div class="poc" aria-label="Aviso">PROVA DE CONCEITO · DADOS FICTÍCIOS · SEM USO CLÍNICO</div>
  <header class="appbar" id="appbar"></header>
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
  <button id="parar" class="btn pri" data-act="parar-voz" hidden>Parar voz</button>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <input id="foto" class="vis" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
</div>

<script>


'use strict';
/* =================== Dados fictícios =================== */

const CONFIG={autoplay:false, limiarLeitura:0.85};
const clonar=o=>JSON.parse(JSON.stringify(o));
const PLANO_V1={
  versao:1, publicadoEm:'2026-10-14T13:20:00.000Z',
  validadoPor:'Farm. Ana Lima · CRF-PE 00000 (fictício)',
  origem:'Receita médica conferida no balcão (documento fictício)',
  vigencia:{inicio:'2026-10-14',fim:'2027-04-14'},
  motivo:'Cadastro inicial do plano',
  pessoa:'Maria Aparecida',
  itens:[
    {id:'los',nome:'Losartana potássica',conc:{valor:50,unidade:'mg'},forma:'comprimido revestido',posologia:'1 comprimido pela manhã',horarios:['08:00'],apelidos:['remédio da pressão','pressão'],orientacao:'Seu farmacêutico registrou: medicamento para a pressão. Tome no horário combinado.'},
    {id:'hid',nome:'Hidroclorotiazida',conc:{valor:25,unidade:'mg'},forma:'comprimido',posologia:'1 comprimido pela manhã',horarios:['08:00'],apelidos:['remédio da pressão','pressão','diurético'],orientacao:'Seu farmacêutico registrou: medicamento para a pressão.'},
    {id:'met',nome:'Cloridrato de metformina',conc:{valor:850,unidade:'mg'},forma:'comprimido',posologia:'1 comprimido no almoço e 1 no jantar',horarios:['12:00','19:00'],apelidos:['remédio do açúcar','açúcar','diabetes','glicose'],orientacao:'Seu farmacêutico registrou: medicamento para o diabetes. Tome junto com a refeição.'},
    {id:'sin',nome:'Sinvastatina',conc:{valor:20,unidade:'mg'},forma:'comprimido revestido',posologia:'1 comprimido à noite',horarios:['21:00'],apelidos:['colesterol','remédio do colesterol'],orientacao:'Seu farmacêutico registrou: medicamento para o colesterol.'}
  ]
};
const PLANO_V2=(()=>{const p=clonar(PLANO_V1);p.versao=2;p.publicadoEm='2026-10-28T14:00:00.000Z';p.motivo='Nova receita: sinvastatina de 20 mg para 40 mg (fictício)';p.itens.find(i=>i.id==='sin').conc.valor=40;return p;})();

const MSG={
  inicio:'Oi, Maria. Pode falar comigo do seu jeito, por exemplo “já tomei o remédio da pressão” ou “o que eu tomo hoje?”. Se preferir, use os botões.',
  acolhe:'Que bom ter você por aqui. Vamos deixar tudo do jeito que fica melhor para você? Pode ler, ouvir ou usar os dois.',
  letra:'Assim fica melhor de ler? Você pode mudar quando quiser.',
  voz:'Quer testar minha voz? Você pode falar mais devagar ou usar só a tela.',
  duvida:'Seu registro não mostra uma confirmação de hoje, mas isso não quer dizer que você não tenha tomado. Vou marcar como dúvida para conferir.',
  bloqueio:'Não posso orientar mudança, repetição ou compensação de dose. Quem pode ajudar com isso é o seu farmacêutico ou o seu médico. Quer que eu mande essa dúvida para o seu farmacêutico?',
  naoEntendi:'Não entendi com segurança. Pode dizer de outro jeito, ou tocar em um dos botões abaixo.',
  falhaImagem:'Não consegui ler essa foto com segurança. Vamos tentar outra, ou prefere pedir ajuda?',
  divergImagem:'A foto mostra uma informação diferente da que está no seu tratamento. Não vou registrar como conferido. Quer falar com seu farmacêutico?'
};

/* =================== Utilidades =================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dataLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const agora=()=>new Date().toISOString();
const fHora=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fData=iso=>new Date(iso.length===10?iso+'T12:00:00':iso).toLocaleDateString('pt-BR');
const fDataHora=iso=>fData(iso)+' '+fHora(iso);
const minutos=h=>{const [a,b]=h.split(':').map(Number);return a*60+b;};
const minAgora=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}

/* =================== Motor ELO (regras determinísticas) =================== */
const SAIS=['cloridrato','potassica','calcica','sodica','maleato','succinato','besilato','monoidratado'];
const baseDe=nome=>norm(nome).split(' ').filter(w=>w.length>3&&!SAIS.includes(w));
const termos=it=>[...new Set([...baseDe(it.nome),norm(it.nome),...it.apelidos.map(norm)])].filter(Boolean);
const temTermo=(t,tm)=>(' '+t+' ').includes(' '+tm+' ');
const concTxt=it=>`${it.conc.valor} ${it.conc.unidade}`;
const nomeComp=it=>`${it.nome} ${concTxt(it)}`;
const NUM=[['oitocentos e cinquenta','850'],['quinhentos','500'],['vinte e cinco','25'],['cinquenta','50'],['quarenta','40'],['vinte','20'],['cem','100'],['mil','1000']];
function numeros(t){let s=' '+t+' ';NUM.forEach(([w,n])=>{s=s.split(' '+w+' ').join(' '+n+' ');});return s.trim();}
function parseConc(s){const m=norm(s).replace(/(\d)\s*(mg|mcg|g)\b/,'$1 $2').match(/(\d+(?:[.,]\d+)?)\s*(mg|mcg|g)?/);return m?{valor:Number(m[1].replace(',','.')),unidade:m[2]||'mg'}:null;}

function resolverItens(t,plano){
  const mapa=new Map();
  plano.itens.forEach(it=>termos(it).forEach(tm=>{if(!mapa.has(tm))mapa.set(tm,new Set());mapa.get(tm).add(it.id);}));
  const achados=[...mapa.entries()].filter(([tm])=>temTermo(t,tm));
  const certos=new Set();
  achados.forEach(([,ids])=>{if(ids.size===1)certos.add([...ids][0]);});
  const amb=new Map();
  achados.forEach(([tm,ids])=>{const arr=[...ids];const k=arr.sort().join('|');if(arr.length>1&&!arr.some(i=>certos.has(i))&&(!amb.has(k)||amb.get(k).termo.length<tm.length))amb.set(k,{termo:tm,ids:arr});});
  return {certos:[...certos],ambiguos:[...amb.values()]};
}
const RX_DOSE=/(dobr|tomo dois|tomar dois|tomo duas|tomar duas|dois de uma vez|duas de uma vez|dose extra|compens|tomo outro|tomar outro|tomo mais um|tomar mais um|aumentar a dose|diminuir a dose|parar de tomar|posso parar|tomo de novo|tomar de novo|tomo agora os dois|junto os dois)/;
const RX_HEDGE=/(nao lembro|nao sei se|acho que|sera que|nao tenho certeza|esqueci)/;
const RX_TOMEI=/\b(tomei|tomado|tomada|bebi)\b/;

function interpretar(texto,plano){
  const t=numeros(norm(texto));
  const R=(decisao,x={})=>({decisao,itens:[],opcoes:[],...x});
  if(/\b(letra|fonte|texto)\b/.test(t)&&/(maior|aument|grande)/.test(t))return R('PREFERENCIA',{pref:{escala:1},msg:'Pronto, aumentei as letras. '+MSG.letra});
  if(/\b(letra|fonte|texto)\b/.test(t)&&/(menor|diminu|pequen)/.test(t))return R('PREFERENCIA',{pref:{escala:-1},msg:'Pronto, diminuí as letras. '+MSG.letra});
  if(/contraste/.test(t))return R('PREFERENCIA',{pref:{contraste:!/(normal|tira|desliga|menos)/.test(t)},msg:'Pronto, mudei o contraste. Você pode mudar quando quiser.'});
  if(/devagar/.test(t))return R('PREFERENCIA',{pref:{vel:-0.2},msg:'Combinado, vou falar mais devagar.'});
  if(/(mais rapido|mais depressa)/.test(t))return R('PREFERENCIA',{pref:{vel:0.2},msg:'Combinado, vou falar um pouco mais rápido.'});
  if(/(so a tela|so tela|sem voz|desliga a voz|desligar a voz|nao quero ouvir|para de falar)/.test(t))return R('PREFERENCIA',{pref:{modo:'ler'},msg:'Combinado, vou usar só a tela. Para voltar a ouvir, diga “quero ouvir”.'});
  if(/(quero ouvir|liga a voz|ligar a voz|pode falar)/.test(t))return R('PREFERENCIA',{pref:{modo:'ambos'},msg:'Combinado, vou ler as respostas em voz alta, além de mostrar na tela.'});
  if(RX_DOSE.test(t))return R('BLOQUEIA_ENCAMINHA',{msg:MSG.bloqueio});
  if(/\brepet|^de novo$|fala de novo|o que voce disse/.test(t))return R('REPETE');
  if(/(farmaceutic|preciso de ajuda|quero ajuda|falar com alguem|atendente)/.test(t))return R('ENCAMINHAR');
  const {certos,ambiguos}=resolverItens(t,plano);
  if(RX_HEDGE.test(t))return R('DUVIDA',{itens:certos});
  if(RX_TOMEI.test(t)){
    if(ambiguos.length){const ids=[...new Set(ambiguos.flatMap(a=>a.ids))];const rot=plano.itens.flatMap(i=>i.apelidos).find(a=>norm(a)===ambiguos[0].termo)||ambiguos[0].termo;return R('ESCLARECER',{opcoes:ids,msg:`“${rot}” pode ser mais de um remédio do seu tratamento. Qual deles você tomou?`});}
    if(!certos.length)return R('ESCLARECER',{opcoes:plano.itens.map(i=>i.id),msg:'Não reconheci o nome com segurança. Qual remédio você tomou?'});
    const nums=(t.match(/\b\d+\b/g)||[]).map(Number).filter(n=>n>=5);
    if(nums.length){
      const its=certos.map(id=>plano.itens.find(i=>i.id===id));
      if(its.length===1&&!nums.includes(its[0].conc.valor))return R('DIVERGENTE',{itens:certos,msg:`Você falou ${nums[0]} mg, mas no seu tratamento ${its[0].nome} é de ${concTxt(its[0])}. Não vou registrar. Quer falar com seu farmacêutico?`});
      if(its.length>1&&!its.some(i=>nums.includes(i.conc.valor)))return R('ESCLARECER',{opcoes:certos,msg:'O número que você falou não bate com seu tratamento. Qual remédio você tomou?'});
    }
    return R('PEDE_CONFIRMACAO',{itens:certos});
  }
  if(/serve/.test(t)){
    if(certos.length===1)return R('ORIENTA',{itens:certos});
    const ids=certos.length?certos:[...new Set(ambiguos.flatMap(a=>a.ids))];
    return R('ESCLARECER',{opcoes:ids.length?ids:plano.itens.map(i=>i.id),msg:'Sobre qual remédio você quer saber?'});
  }
  if(/(o que|quais|qual).*(tomo|tomar|remedio)|\bhoje\b|horario/.test(t))return R('LISTA');
  return R('NAO_ENTENDI');
}

function itemPorNome(nome,plano){const n=norm(nome);return plano.itens.find(it=>baseDe(it.nome).some(b=>temTermo(n,b)));}
function conferir(l,plano,opts){opts=opts||{};
  const L=CONFIG.limiarLeitura;
  if(l.multiplas)return {decisao:'INCONCLUSIVO',motivo:'Há mais de uma embalagem na foto.'};
  const ok=k=>!!l[k]&&((l.conf||{})[k]??0)>=L;
  if(!ok('nome'))return {decisao:'INCONCLUSIVO',motivo:'O nome do medicamento não ficou legível.'};
  const it=itemPorNome(l.nome,plano);
  if(!it)return {decisao:'DIVERGENTE',motivo:'Este medicamento não está no seu tratamento atual.'};
  if(!ok('conc'))return {decisao:'INCONCLUSIVO',itemId:it.id,motivo:'A concentração não ficou legível ou não aparece na foto.'};
  const c=parseConc(l.conc);
  if(!c||c.valor!==it.conc.valor||c.unidade!==it.conc.unidade)return {decisao:'DIVERGENTE',itemId:it.id,motivo:`Concentração diferente: na foto ${l.conc}, no tratamento ${concTxt(it)}.`};
  if(opts.formaOpcional&&!ok('forma'))return {decisao:'CONFIRMA',itemId:it.id,motivo:'Nome e concentração conferem com o plano vigente. A forma não aparece escrita na foto.'};
  if(!ok('forma'))return {decisao:'INCONCLUSIVO',itemId:it.id,motivo:'A forma farmacêutica não ficou legível.'};
  const fOk=opts.formaOpcional?norm(l.forma).split(' ')[0]===norm(it.forma).split(' ')[0]:norm(l.forma)===norm(it.forma);
  if(!fOk)return {decisao:'DIVERGENTE',itemId:it.id,motivo:`Forma diferente: na foto ${l.forma}, no tratamento ${it.forma}.`};
  return {decisao:'CONFIRMA',itemId:it.id,motivo:'Nome, concentração e forma conferem com o plano vigente.'};
}

/* =================== Cenários sintéticos (40) =================== */
const I=(nome,conc,forma,cn,cc,cf)=>({nome,conc,forma,conf:{nome:cn,conc:cc,forma:cf}});
const CASOS=[
  {id:'C01',tipo:'imagem',rotulo:'Caixa nítida',desc:'Losartana potássica 50 mg, boa iluminação',leitura:I('Losartana potássica','50 mg','comprimido revestido',.97,.95,.92),esperado:'CONFIRMA'},
  {id:'C02',tipo:'imagem',rotulo:'Caixa nítida',desc:'Hidroclorotiazida 25 mg, boa iluminação',leitura:I('Hidroclorotiazida','25 mg','comprimido',.96,.94,.90),esperado:'CONFIRMA'},
  {id:'C03',tipo:'imagem',rotulo:'Caixa nítida',desc:'Cloridrato de metformina 850 mg',leitura:I('Cloridrato de metformina','850 mg','comprimido',.95,.93,.91),esperado:'CONFIRMA'},
  {id:'C04',tipo:'imagem',rotulo:'Caixa nítida',desc:'Sinvastatina 20 mg',leitura:I('Sinvastatina','20 mg','comprimido revestido',.98,.96,.90),esperado:'CONFIRMA'},
  {id:'C05',tipo:'imagem',rotulo:'Texto em caixa alta',desc:'“LOSARTANA POTÁSSICA 50mg”, sem espaço antes da unidade',leitura:I('LOSARTANA POTÁSSICA','50mg','COMPRIMIDO REVESTIDO',.93,.90,.88),esperado:'CONFIRMA'},
  {id:'C06',tipo:'imagem',rotulo:'Blister',efeito:'blister',desc:'Blister com “Metformina 850 mg”',leitura:I('Metformina','850 mg','comprimido',.90,.89,.87),esperado:'CONFIRMA'},
  {id:'C07',tipo:'imagem',rotulo:'Foto inclinada',efeito:'inclinada',desc:'Sinvastatina 20 mg fotografada inclinada',leitura:I('Sinvastatina','20 mg','comprimido revestido',.90,.88,.86),esperado:'CONFIRMA'},
  {id:'C08',tipo:'imagem',rotulo:'Outro laboratório',desc:'Hidroclorotiazida 25 mg de outro fabricante',leitura:I('Hidroclorotiazida','25 mg','comprimido',.94,.92,.90),esperado:'CONFIRMA'},
  {id:'D01',tipo:'imagem',div:1,rotulo:'Mesma caixa, outra dose',desc:'Losartana potássica 100 mg (plano: 50 mg)',leitura:I('Losartana potássica','100 mg','comprimido revestido',.96,.95,.92),esperado:'DIVERGENTE'},
  {id:'D02',tipo:'imagem',div:1,rotulo:'Outra concentração',desc:'Cloridrato de metformina 500 mg (plano: 850 mg)',leitura:I('Cloridrato de metformina','500 mg','comprimido',.95,.94,.91),esperado:'DIVERGENTE'},

function falaSemPlano(texto,cond){
  const t=numeros(norm(texto));
  if(cond==='B'&&/\brepet/.test(t))return 'REPETE';
  if(/\btomei\b/.test(t)){const r=resolverItens(t,PLANO_V1);if(r.certos.length||r.ambiguos.length)return 'REGISTRA';}
  return 'NAO_REGISTRA';
}
function conferirB(l){const x=l.multiplas?l.leituras[0]:l;return (x.nome&&x.conf.nome>=CONFIG.limiarLeitura)?'CONFIRMA':'INCONCLUSIVO';}
function rodar(cond,c){
  const plano=c.plano==='v2'?PLANO_V2:PLANO_V1;let out;
  if(c.tipo==='imagem')out=cond==='A'?'CONFIRMA':cond==='B'?conferirB(c.leitura):conferir(c.leitura,plano).decisao;
  else if(c.tipo==='fala')out=cond==='C'?interpretar(c.texto,plano).decisao:falaSemPlano(c.texto,cond);
  else if(c.tipo==='toque')out=cond==='C'?(c.confirmacao==='sim'?'REGISTRA':'NAO_REGISTRA'):'REGISTRA';
  else out='NAO_REGISTRA';
  const ev=cond==='A'?{ts:1,origem:'autocadastro',tipo:c.tipo}:cond==='B'?{ts:1,origem:c.tipo==='imagem'?'foto':'voz',tipo:c.tipo,estado:out}:{ts:1,origem:c.tipo,tipo:c.tipo,versaoPlano:plano.versao,estado:out};
  return {out,ev};
}
const CAMPOS=['ts','origem','tipo','versaoPlano','estado'];
const SEGURAS=new Set(['ESCLARECER','INCONCLUSIVO','DUVIDA','BLOQUEIA_ENCAMINHA','DIVERGENTE','PEDE_CONFIRMACAO']);
function metricas(res,cond){
  const m={falsa:0,semConf:0,sens:0,nDiv:0,rast:0,conc:0,inc:0,nInc:0,porGrupo:{}};
  res.forEach(r=>{const c=r.caso,o=r[cond].out,g=c.id[0];
    if((o==='CONFIRMA'||o==='REGISTRA')&&!['CONFIRMA','REGISTRA','PEDE_CONFIRMACAO'].includes(c.esperado))m.falsa++;
    if(o==='REGISTRA'&&!c.confirmacaoExplicita)m.semConf++;
    if(c.div){m.nDiv++;if(o==='DIVERGENTE')m.sens++;}
    if(CAMPOS.every(k=>r[cond].ev[k]!==undefined))m.rast++;
    if(o===c.esperado)m.conc++;
    if(g==='F'||g==='I'||c.id==='R05'||c.id==='R06'){m.nInc++;if(o===c.esperado&&SEGURAS.has(o))m.inc++;}
    m.porGrupo[g]=(m.porGrupo[g]||0)+(o===c.esperado?1:0);
  });
  return m;
}

const IA={tipo:null,sample:null};
async function iniciarIA(){

function backend(){if(IA.tipo==='claude')return 'claude';if(state.ia.proxy)return 'proxy';if(state.ia.chave)return 'api';return 'demo';}
function promptIA(ctx){
  const esp=ctx.item?item(ctx.item):null;
  return `Você é o módulo de análise visual do ELO, um protótipo acadêmico de acompanhamento de medicamentos (sem uso clínico).
${ctx.modo==='comprovacao'?'A pessoa enviou uma foto para acompanhar o registro de que tomou um medicamento. Descreva apenas os indícios visuais.':'A pessoa quer conferir qual medicamento aparece na embalagem da foto.'}
${esp?`Medicamento que a pessoa está registrando: ${esp.nome} ${concTxt(esp)}, ${esp.forma}.`:''}
Regras:
1. Transcreva só o que está legível na foto. Se não conseguir ler, use null e confiança baixa. Não complete nomes nem doses por suposição, nem a partir do medicamento informado acima.
2. Dê uma confiança de 0 a 1 para cada campo lido.
3. Não identifique nem descreva pessoas.
4. Não dê orientação clínica nem sobre dose.
5. Uma foto não comprova que o remédio foi engolido; descreva somente o que aparece.
Responda apenas com um objeto JSON neste formato, sem texto antes ou depois:
{"tipo_imagem":"caixa"|"blister"|"comprimido_solto"|"outro"|"ilegivel","nome_lido":string|null,"nome_confianca":number,"concentracao_lida":string|null,"concentracao_confianca":number,"forma_lida":string|null,"forma_confianca":number,"alveolo_vazio_visivel":boolean|null,"multiplas_embalagens":boolean,"observacao":"uma frase curta, em português simples, dirigida à pessoa","pedir_nova_foto":boolean}`;
}
function limparIA(o){
  o=o||{};const s=v=>typeof v==='string'&&v.trim()?v.trim().slice(0,120):null;const n=v=>{v=Number(v);return isFinite(v)?Math.max(0,Math.min(1,v)):0;};
  return {tipo_imagem:s(o.tipo_imagem)||'outro',nome_lido:s(o.nome_lido),nome_confianca:n(o.nome_confianca),concentracao_lida:s(o.concentracao_lida),concentracao_confianca:n(o.concentracao_confianca),forma_lida:s(o.forma_lida),forma_confianca:n(o.forma_confianca),alveolo_vazio_visivel:typeof o.alveolo_vazio_visivel==='boolean'?o.alveolo_vazio_visivel:null,multiplas_embalagens:!!o.multiplas_embalagens,observacao:s(o.observacao)||'',pedir_nova_foto:!!o.pedir_nova_foto};
}
function extrairJSON(t){try{return JSON.parse(t);}catch(e){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));throw {code:'invalid_json'};}}
async function chamarIA(foto,ctx,signal){
  const b=backend(),prompt=promptIA(ctx);
  if(b==='claude')return limparIA(await IA.sample.json(prompt,{images:[foto.blob],modelTier:'default',cache:false,signal}));
  if(b==='proxy'){const esp=ctx.item?item(ctx.item):null;
    const r=await fetch(state.ia.proxy,{method:'POST',headers:{'content-type':'application/json'},signal,body:JSON.stringify({imagem:foto.b64,media_type:'image/jpeg',modo:ctx.modo,esperado:esp?{nome:esp.nome,concentracao:concTxt(esp),forma:esp.forma}:null})});
    if(!r.ok)throw {code:'http',message:'O servidor de análise respondeu '+r.status};return limparIA(await r.json());}
  if(b==='api'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':state.ia.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:state.ia.modelo||'claude-sonnet-5-5',max_tokens:700,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:foto.b64}},{type:'text',text:prompt}]}]})});
    if(!r.ok)throw {code:'http',message:'A API respondeu '+r.status+(r.status===401?' (chave inválida)':'')};
    const d=await r.json();const t=(d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');return limparIA(extrairJSON(t));}
  throw {code:'demo'};
}
function erroIA(e){
  const c=e&&e.code;
  if(c==='demo')return 'A análise por IA não está ligada neste aparelho. Veja em Ajustes › Análise de fotos.';
  if(c==='not_granted')return 'A análise por IA não foi permitida nesta página.';
  if(c==='rate_limited')return 'Muitas análises seguidas. Tente de novo em alguns minutos.';
  if(c==='image_rejected')return 'Não consegui abrir essa imagem. Tente outra foto.';
  if(c==='refused')return 'A IA não analisou essa foto. Tente uma foto só da embalagem.';
  if(c==='cancelled'||(e&&e.name==='AbortError'))return 'Análise cancelada.';
  if(c==='invalid_json')return 'A resposta da IA veio num formato inesperado. Tente de novo.';
  return (e&&e.message)?'Não consegui analisar agora: '+e.message:'Não consegui analisar agora. Verifique a conexão e tente de novo.';
}
async function prepararImagem(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('formato'));i.src=url;});
    const W=img.naturalWidth,H=img.naturalHeight,s=Math.min(1,1280/Math.max(W,H));
    const c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));const b64=c.toDataURL('image/jpeg',.85).split(',')[1];
    const t=document.createElement('canvas'),ts=Math.min(1,220/Math.max(c.width,c.height));t.width=Math.round(c.width*ts);t.height=Math.round(c.height*ts);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
    return {blob,b64,thumb:t.toDataURL('image/jpeg',.7)};
  }finally{URL.revokeObjectURL(url);}
}
function avaliar(ia,ctx){
  if(!ia)return {decisao:'INCONCLUSIVO',motivo:'Sem análise.'};
  if(ia.tipo_imagem==='ilegivel'&&!ia.nome_lido)return {decisao:'INCONCLUSIVO',motivo:ia.observacao||'A foto não ficou legível.'};
  const l={nome:ia.nome_lido,conc:ia.concentracao_lida,forma:ia.forma_lida,conf:{nome:ia.nome_confianca,conc:ia.concentracao_confianca,forma:ia.forma_confianca},multiplas:ia.multiplas_embalagens};
  const r=conferir(l,planoAtual(),{formaOpcional:ctx.modo==='comprovacao'});
  if(ctx.item&&r.itemId&&r.itemId!==ctx.item&&r.decisao!=='INCONCLUSIVO'){const a=item(r.itemId),b=item(ctx.item);return {decisao:'DIVERGENTE',itemId:r.itemId,motivo:`A foto mostra ${nomeComp(a)}, mas você está registrando ${nomeComp(b)}.`};}
  return r;
}
async function executarAnalise(foto,ctx,signal){
  let ia=null,erro=null,fonte;
  if(foto.ex){fonte='simulada';const p=PROVAS.find(x=>x.id===foto.ex);if(p)ia=limparIA(p.ia);else{const l=CASOS.find(x=>x.id===foto.ex).leitura;const x=l.multiplas?l.leituras[0]:l;ia=limparIA({tipo_imagem:'caixa',nome_lido:x.nome,nome_confianca:x.conf.nome,concentracao_lida:x.conc,concentracao_confianca:x.conf.conc,forma_lida:x.forma,forma_confianca:x.conf.forma,alveolo_vazio_visivel:null,multiplas_embalagens:!!l.multiplas,observacao:'',pedir_nova_foto:false});}await sleep(1100);}
  else{fonte=backend();try{ia=await chamarIA(foto,ctx,signal);}catch(e){erro=erroIA(e);}}
  const res=ia?avaliar(ia,ctx):{decisao:'INCONCLUSIVO',motivo:erro};
  const estado={CONFIRMA:'correspondente',DIVERGENTE:'divergente',INCONCLUSIVO:'inconclusivo'}[res.decisao];
  const det=`${FONTE[fonte]}. ${ia&&ia.observacao?ia.observacao+' ':''}${res.motivo||''}${ctx.modo==='comprovacao'?' Indício visual; não comprova ingestão.':''}`.trim();
  const ev=logEvento({tipo:ctx.modo==='comprovacao'?'evidencia_foto':'conferencia',itemId:res.itemId||ctx.item||null,origem:foto.ex?'imagem_simulada':'foto_aparelho',estado,detalhe:det,foto:{thumb:foto.thumb||null,ex:foto.ex||null},analise:{fonte,ia}});
  return {res,ia,ev,fonte,erro};
}
function textoResultado(a,ctx){
  const r=a.res,it=r.itemId?item(r.itemId):null;
  if(r.decisao==='CONFIRMA'){
    if(ctx.modo==='comprovacao')return `A foto mostra ${nomeComp(it)}${a.ia&&a.ia.alveolo_vazio_visivel?', com espaço vazio na cartela':''}. Confere com o seu tratamento. Confirma que tomou agora?`;

}

function renderSheet(){
  const s=$('#sheet'),sc=$('#scrim'),aberto=!!ui.sheet;
  ['#screen','#tabbar','#appbar'].forEach(q=>{$(q).inert=aberto;});
  if(!aberto){s.hidden=true;sc.hidden=true;s.innerHTML='';return;}
  s.className='sheet'+(perfilAtual()==='paciente'?' pac':'');
  s.innerHTML='<div class="grab" aria-hidden="true"></div>'+SHEETS[ui.sheet.tipo](ui.sheet.arg);
  s.hidden=false;sc.hidden=false;s.scrollTop=0;
  const f=s.querySelector('[data-foco]')||s.querySelector('button,input,textarea');f&&f.focus({preventScroll:true});
}

/* =================== Fluxo de foto =================== */
function abrirFoto(ctx){ui.fotoCtx=ctx;abrirSheet('foto');}
function abrirCamera(){
  const real=backend()!=='demo';
  if(real&&!state.prefs.consentFoto){abrirSheet('consentimento');return;}
  const f=$('#foto');f.value='';f.click();
}
async function processarFoto(foto){
  const ctx=ui.fotoCtx||{modo:'conferencia',destino:'sheet'};
  if(ctx.destino==='chat')return fotoNaConversa(foto,ctx);
  const ctl=new AbortController();
  ui.analise={ctx,foto,status:'carregando',ctl};ui.sheet={tipo:'analise'};renderSheet();falar('Estou olhando sua foto.');
  const out=await executarAnalise(foto,ctx,ctl.signal);
  if(ui.analise&&ui.analise.ctl===ctl){ui.analise.out=out;ui.analise.status='pronto';if(ui.sheet&&ui.sheet.tipo==='analise')renderSheet();falar(textoResultado(out,ctx));}
  if(ROTA().pf==='paciente')render();
}
async function fotoNaConversa(foto,ctx){
  ui.sheet=null;
  state.chat.push({de:'voce',texto:ctx.modo==='comprovacao'?'Foto da cartela':'Foto da embalagem',foto:{thumb:foto.thumb||null,ex:foto.ex||null},origem:'foto'});
  const m={de:'elo',texto:'Estou olhando sua foto…',pendente:true};state.chat.push(m);salvar();render();falar('Estou olhando sua foto.');
  const out=await executarAnalise(foto,ctx);
  m.pendente=false;m.texto=textoResultado(out,ctx);m.fonte=out.fonte;
  const r=out.res;
  if(ctx.modo==='comprovacao'&&r.decisao==='CONFIRMA')m.acoes=[{rot:'Sim, tomei',tipo:'confirmar',itens:[r.itemId],evidencia:out.ev.id},{rot:'Não',tipo:'cancelar'}];
  else if(r.decisao==='CONFIRMA')m.acoes=[];
  else m.acoes=[{rot:'Tirar outra foto',tipo:'foto',modo:ctx.modo,item:ctx.item||null},{rot:'Mandar para o farmacêutico',tipo:'enc'}];
  salvar();render();falar(m.texto);
}

function blocoEscala(){const pct=Math.round(state.prefs.escala*100);return `<div class="stepper"><button class="btn" data-act="escala" data-arg="-1" aria-label="Diminuir letras">A−</button><span class="val" aria-live="polite">${pct}%</span><button class="btn" data-act="escala" data-arg="1" aria-label="Aumentar letras" style="font-size:1.2em">A+</button></div>
  <div class="preview"><div class="rx"><span class="nm">Cloridrato de metformina</span><span class="lead"></span><span class="cc">850 mg</span></div><p class="sub">1 comprimido no almoço e 1 no jantar</p></div>`;}
function blocoVoz(){const P=state.prefs;return `<div class="row"><button class="btn grow" data-act="testar-voz">${ic('som',20)}Testar minha voz</button><button class="btn" data-act="parar-voz">Parar</button></div>

const periodo=h=>{const m=minutos(h);return m<720?'Manhã':m<1080?'Tarde':'Noite';};
function renderHoje(){
  const p=planoAtual(),n=minAgora(),sl=slotsHoje(),est=sl.map(s=>estadoSlot(s.key));

    <div class="segbar" aria-hidden="true">${est.map(e=>`<i class="${e?(e.tipo==='tomada'?'ok':'warn'):''}"></i>`).join('')}</div></div>`;

  });
  const ult=p.itens.map(it=>{const d=state.dispensacoes.filter(x=>x.itemId===it.id).pop();return `<div class="row sb"><span>${esc(it.nome)}</span><span class="num sub">${d?fData(d.data):'—'}</span></div>`;}).join('');
  const meus=state.encaminhamentos.slice().reverse().slice(0,3).map(e=>`<div class="row sb"><span class="num sub">${fDataHora(e.ts)}</span><span class="chip ${e.estado==='respondido'?'ok':'acc'}">${e.estado==='respondido'?'Respondido':e.estado==='em_analise'?'Em análise':'Enviado'}</span></div>`).join('');
  html+=`<div class="sec">Farmácia</div>
    <button class="hero" data-act="sheet" data-arg="enc"><span class="ico">${ic('conversar',26)}</span><span><strong>Falar com meu farmacêutico</strong><span>Você confere o que será enviado</span></span></button>

function enviarChat(texto,origem){
  texto=String(texto||'').trim();if(!texto)return;
  state.chat.push({de:'voce',texto,origem});
  responder(interpretar(texto,planoAtual()),origem,texto);
}
function responder(r,origem,texto){
  const p=planoAtual(),m={de:'elo',texto:'',acoes:[]},enc={rot:'Mandar para o farmacêutico',tipo:'enc'};
  switch(r.decisao){
    case 'PREFERENCIA':aplicarPref(r.pref);m.texto=r.msg;break;
    case 'BLOQUEIA_ENCAMINHA':logEvento({tipo:'bloqueio',origem,estado:'bloqueado',detalhe:`“${texto}”`});m.texto=r.msg;m.acoes=[enc,{rot:'Agora não',tipo:'cancelar'}];break;
    case 'REPETE':{const ult=state.chat.slice(0,-1).reverse().find(x=>x.de==='elo');m.texto=ult?ult.texto:MSG.inicio;if(ult&&ult.acoes&&!ult.feito){m.acoes=ult.acoes;ult.feito=true;}break;}
    case 'ENCAMINHAR':m.texto='Posso preparar um resumo curto para o seu farmacêutico. Você confere tudo antes de enviar.';m.acoes=[{rot:'Ver o resumo',tipo:'enc'}];break;
    case 'DUVIDA':(r.itens.length?r.itens:[null]).forEach(id=>{const s=id?slotParaItem(id):null;logEvento({tipo:'duvida',itemId:id,slot:s?s.key:null,origem,estado:'duvida',detalhe:`“${texto}”`});});
      m.texto=MSG.duvida+' Não vou orientar dose extra. Se quiser, mando sua dúvida para o seu farmacêutico.';m.acoes=[enc];break;
    case 'ESCLARECER':m.texto=r.msg+' Se preferir, mande uma foto da caixa.';m.acoes=r.opcoes.map(id=>({rot:nomeComp(item(id)),tipo:'escolher',item:id})).concat([{rot:'Mandar foto da caixa',tipo:'foto',modo:'conferencia'},{rot:'Nenhum desses',tipo:'cancelar'}]);break;
    case 'DIVERGENTE':logEvento({tipo:'relato',itemId:r.itens[0]||null,origem,estado:'divergente',detalhe:`“${texto}”`});m.texto=r.msg+' Se quiser, mande uma foto da caixa para eu conferir.';m.acoes=[{rot:'Mandar foto da caixa',tipo:'foto',modo:'conferencia'},enc,{rot:'Tudo bem',tipo:'cancelar'}];break;
    case 'PEDE_CONFIRMACAO':m.texto=`Confirma que você tomou agora: ${r.itens.map(id=>nomeComp(item(id))).join(' e ')}?${r.itens.length===1?' Se quiser, mande junto uma foto da cartela.':''}`;
      m.acoes=[{rot:'Sim, tomei',tipo:'confirmar',itens:r.itens}].concat(r.itens.length===1?[{rot:'Mandar foto da cartela',tipo:'foto',modo:'comprovacao',item:r.itens[0]}]:[]).concat([{rot:'Não',tipo:'cancelar'}]);break;
    case 'LISTA':m.texto='Hoje você tem: '+slotsHoje().map(s=>`${s.hora}, ${nomeComp(s.item)}`).join('; ')+'.';break;
    case 'ORIENTA':{const it=item(r.itens[0]);m.texto=`${it.orientacao} (Fonte: tratamento versão ${p.versao}, conferido por ${p.validadoPor}.)`;break;}
    default:m.texto=MSG.naoEntendi;
  }
  state.chat.push(m);state.chat=state.chat.slice(-60);salvar();render();falar(m.texto);
}
function acaoChat(arg){
  const [i,j]=arg.split(':').map(Number),msg=state.chat[i];if(!msg||msg.feito)return;
  const a=msg.acoes[j];
  if(a.tipo==='foto'){const it=a.item;const s=it?slotParaItem(it):null;abrirFoto({modo:a.modo,item:it||null,slot:s?s.key:null,destino:'chat'});return;}
  msg.feito=true;state.chat.push({de:'voce',texto:a.rot,origem:'toque'});
  if(a.tipo==='confirmar'){a.itens.forEach(id=>{const s=slotParaItem(id);if(s)registrarTomada(s.key,'toque',a.evidencia?'Confirmação explícita na conversa, com foto analisada. Não comprova ingestão.':'Confirmação explícita na conversa. Não comprova ingestão.',a.evidencia||null);});
    const t=`Pronto. Registrei que você confirmou: ${a.itens.map(id=>nomeComp(item(id))).join(' e ')}${a.evidencia?', com a foto anexada para o farmacêutico':''}.`;state.chat.push({de:'elo',texto:t});salvar();render();falar(t);}
  else if(a.tipo==='escolher')responder({decisao:'PEDE_CONFIRMACAO',itens:[a.item]},'toque',a.rot);
  else if(a.tipo==='enc'){const t='Abri o resumo para você conferir antes de enviar.';state.chat.push({de:'elo',texto:t});salvar();ui.sheet={tipo:'enc'};render();falar(t);}
  else{const t='Tudo bem. Não registrei nada.';state.chat.push({de:'elo',texto:t});salvar();render();falar(t);}
}

    ['Nunca marcar dose tomada sem confirmação explícita','Falso registro de tomada','Confirmação “Sim, tomei” obrigatória, com ou sem foto',['R03','R04','F05','F06'],null],
    ['Nunca recomendar alteração, duplicação ou compensação de dose','Orientação clínica indevida','Regra de bloqueio com encaminhamento; IA proibida de orientar dose',['R06'],null],
    ['Explicitar origem e versão da prescrição','Uso de plano desatualizado','Todo evento carrega versão; comparação com plano vigente',['R08'],null],
    ['Interromper a voz, repetir e usar entrada alternativa','Dependência de um único canal','“Parar voz”, comando “repete”, toque, texto e foto',['R07'],null],
    ['Não publicar CPF, prescrições reais ou dados sensíveis','Exposição de dados de saúde','Sem campo de CPF; aviso antes de enviar foto; foto fica no aparelho',[],'Inspeção dos dados do demonstrador'],
    ['Revisão farmacêutica como encaminhamento, não atendimento real','Expectativa de atendimento clínico','Vínculo simulado e rotulado',[],'Inspeção das telas de encaminhamento']

function csv(){const l=['id,grupo,descricao,gabarito,A,B,C'];ui.res.forEach(r=>{const c=r.caso;l.push([c.id,GRUPOS[c.id[0]],(c.texto?c.texto+' | ':'')+c.desc,c.esperado,r.A.out,r.B.out,r.C.out].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));});return l.join('\n');}

  else if(f.id==='draft-form')publicarDraft();
  else if(f.id==='form-ia'){state.ia={proxy:val('ia-proxy'),chave:val('ia-chave'),modelo:val('ia-modelo')||'claude-sonnet-5-5'};if(state.ia.proxy&&!/^https:\/\//.test(state.ia.proxy)){aviso('O endereço precisa começar com https://');return;}salvar();render();aviso(backend()==='demo'?'Análise por IA desligada.':'Configuração salva.');}
  else if(f.id==='form-resp'){const id=f.dataset.enc,t=val('resp-txt');if(!t){aviso('Escreva o retorno antes de enviar.');return;}const en=state.encaminhamentos.find(x=>x.id===id);en.resposta=t;en.estado='respondido';en.respondidoEm=agora();
    (en.eventos||[]).forEach(eid=>{const ev=state.eventos.find(x=>x.id===eid);if(ev){ev.revisado=true;ev.revisadoEm=agora();}});ui.sheet=null;salvar();render();aviso('Retorno registrado (simulação).');}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.input==='vel'){state.prefs.vel=Number(e.target.value);salvar();const s=$('#vel-val');if(s)s.textContent=state.prefs.vel.toFixed(1)+'×';}});
document.addEventListener('change',async e=>{
  if(e.target.id==='foto'&&e.target.files&&e.target.files[0]){
    const file=e.target.files[0];
    try{const foto=await prepararImagem(file);processarFoto(foto);}
    catch(err){aviso('Não consegui abrir essa imagem. Tente uma foto em JPG ou PNG.');}
  }
});
window.addEventListener('hashchange',aoMudarRota);
if(temVoz){try{window.speechSynthesis.getVoices();}catch(e){}}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
iniciarIA();
</script>
</body>
